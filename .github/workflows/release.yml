name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_marketplaces:
        description: "Also publish to VS Code Marketplace and Open VSX (run on a version tag)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # for Microsoft Entra (OIDC) sign-in to the Marketplace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run package

      - name: Sign in to Microsoft Entra
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_marketplaces }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_marketplaces }}
        run: npx vsce publish --packagePath kfp-dag-preview.vsix --azure-credential

      - name: Publish to Open VSX
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_marketplaces }}
        run: npx ovsx publish kfp-dag-preview.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: kfp-dag-preview.vsix
          generate_release_notes: true
